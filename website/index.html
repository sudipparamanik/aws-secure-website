
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure AWS Static Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 650px;
            padding: 40px;
        }

        h1 {
            color: #38bdf8;
            font-size: 38px;
        }

        p {
            color: #cbd5e1;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            background: #14532d;
            color: #bbf7d0;
            padding: 10px 18px;
            border-radius: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Secure AWS Website</h1>

        <p>
            This website is hosted on Amazon S3
            and will be delivered securely through
            Amazon CloudFront.
        </p>

        <div class="status">
            Infrastructure deployment in progress
        </div>
    </div>
</body>
</html>
